<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 최저가 측정기</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">✈️ TripFinder</a>
        <span class="header-label">여행 가격 비교</span>
    </header>

    <main class="container">
        <section class="hero">
            <p class="eyebrow">SMART TRAVEL PLANNER</p>
            <h1>여행의 최저가를<br>한눈에 찾아보세요.</h1>
            <p class="hero-description">
                항공권과 숙소 가격을 비교하고 마음에 드는 가격을 저장하세요.
            </p>
        </section>

        <section class="search-panel">
            <div class="tabs">
                <button class="tab active" id="flightTab" type="button">
                    ✈️ 항공권
                </button>
                <button class="tab" id="hotelTab" type="button">
                    🏨 숙소
                </button>
            </div>

            <form id="flightForm" class="search-form">
                <div class="field">
                    <label for="origin">출발지</label>
                    <input id="origin" type="text"
                           placeholder="예: 서울" required>
                </div>

                <div class="field">
                    <label for="flightDestination">도착지</label>
                    <input id="flightDestination" type="text"
                           placeholder="예: 제주" required>
                </div>

                <div class="field">
                    <label for="flightDate">출발 날짜</label>
                    <input id="flightDate" type="date" required>
                </div>

                <button class="primary-button" type="submit">
                    항공권 검색
                </button>
            </form>

            <form id="hotelForm" class="search-form hidden">
                <div class="field">
                    <label for="hotelDestination">여행지</label>
                    <input id="hotelDestination" type="text"
                           placeholder="예: 부산" required>
                </div>

                <div class="field">
                    <label for="checkin">체크인</label>
                    <input id="checkin" type="date" required>
                </div>

                <div class="field">
                    <label for="checkout">체크아웃</label>
                    <input id="checkout" type="date" required>
                </div>

                <button class="primary-button" type="submit">
                    숙소 검색
                </button>
            </form>

            <p class="demo-notice">
                ⚠️ 현재 검색 결과는 기능 테스트용 예시 가격입니다.
                실제 판매 가격이 아닙니다.
            </p>
        </section>

        <section class="results-section">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">SEARCH RESULTS</p>
                    <h2>검색 결과</h2>
                </div>
                <span id="resultCount" class="count">0개</span>
            </div>

            <p id="statusMessage" class="status-message">
                여행 정보를 입력하고 검색해 보세요!
            </p>

            <div id="results" class="results-list"></div>
        </section>

        <section class="history-section">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">SAVED PRICES</p>
                    <h2>저장한 가격</h2>
                </div>
                <button id="refreshHistory" class="secondary-button"
                        type="button">
                    새로고침
                </button>
            </div>

            <p id="historyMessage" class="status-message">
                저장한 가격이 여기에 표시됩니다.
            </p>

            <div id="historyList" class="history-list"></div>
        </section>
    </main>

    <footer class="footer">
        <p>TripFinder · 나만의 여행 가격 기록장</p>
    </footer>
</body>
</html>
